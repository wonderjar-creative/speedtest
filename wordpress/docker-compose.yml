# Docker Compose for WordPress
# Local dev: docker-compose up -d (auto-merges override for port 8080)
# Production: Coolify deploys this directly — Traefik handles routing

services:
  # WordPress + PHP + Apache (all-in-one)
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: speedtest-wp
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      # Share WordPress files with WP-CLI
      - wp_data:/var/www/html
      # Mount your theme into WordPress
      - ./theme:/var/www/html/wp-content/themes/elevation-theme
      # Persist uploads between restarts
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: speedtest-db
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      # Persist database between restarts
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # WP-CLI for running WordPress commands
  wpcli:
    build:
      context: .
      dockerfile: Dockerfile.wpcli
    container_name: speedtest-wpcli
    user: "33:33"  # Run as www-data (same as wordpress container)
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/elevation-theme
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      - wordpress

# Named volumes (Docker manages these)
volumes:
  db_data:
  wp_data:
  wp_uploads:
