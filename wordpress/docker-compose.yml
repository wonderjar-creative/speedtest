# Docker Compose for WordPress
# Local dev: docker-compose up -d (auto-merges override for the local port, default 8082, + wpcli)
# Production: Coolify deploys this directly — Traefik handles routing

services:
  wordpress:
    build:
      context: .
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-mariadb}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SERVICE_URL_WORDPRESS:-http://localhost:8082}');
        define('WP_SITEURL', '${SERVICE_URL_WORDPRESS:-http://localhost:8082}');
        define('GRAPHQL_JWT_AUTH_SECRET_KEY', '${GRAPHQL_JWT_AUTH_SECRET_KEY:-speedtest-jwt-dev-secret}');
        define('HEADLESS_URL', '${HEADLESS_URL:-http://localhost:3000}');
        define('HEADLESS_SECRET', '${HEADLESS_SECRET:-speedtest-dev-secret}');
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
      - wp_plugins:/var/www/html/wp-content/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wp_uploads:
  wp_plugins:
  db_data:
