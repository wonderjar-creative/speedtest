# Docker Compose for WordPress
# Local dev: docker-compose up -d (auto-merges override for port 8080)
# Production: Coolify deploys this directly — Traefik handles routing

services:
  # WordPress + PHP + Apache (all-in-one)
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: speedtest-wp:latest
    container_name: speedtest-wp
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SERVICE_URL_WORDPRESS:-http://localhost:8080}');
        define('WP_SITEURL', '${SERVICE_URL_WORDPRESS:-http://localhost:8080}');
    volumes:
      # Persist WordPress core files
      - wp_data:/var/www/html
      # Persist uploads between restarts
      - wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: speedtest-db
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      # Persist database between restarts
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5


# Named volumes (Docker manages these)
volumes:
  db_data:
  wp_data:
  wp_uploads:
