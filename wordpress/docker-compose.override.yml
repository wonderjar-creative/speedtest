# Local development overrides (auto-merged by docker-compose)
# NOT used in Coolify — Traefik handles routing in production

services:
  wordpress:
    container_name: speedtest-wp
    ports:
      - "8080:80"
    volumes:
      # Hot-reload theme locally
      - ./theme:/var/www/html/wp-content/themes/elevation-theme

  # WP-CLI as a separate container for local dev
  wpcli:
    image: wordpress:cli
    container_name: speedtest-wpcli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-mariadb}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - ./theme:/var/www/html/wp-content/themes/elevation-theme
      - wp_uploads:/var/www/html/wp-content/uploads
      - wp_plugins:/var/www/html/wp-content/plugins
      - ./seed.sh:/tmp/seed.sh:ro
      - ./data:/tmp/data:ro
    depends_on:
      - wordpress
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp_uploads:
  wp_plugins:
